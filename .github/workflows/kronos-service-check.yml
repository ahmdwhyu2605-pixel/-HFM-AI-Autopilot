name: Kronos service checks

on:
  push:
    paths:
      - "kronos-service/**"
      - "render.yaml"
      - ".github/workflows/kronos-service-check.yml"
  pull_request:
    paths:
      - "kronos-service/**"
      - "render.yaml"
      - ".github/workflows/kronos-service-check.yml"

jobs:
  python-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kronos-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile service
        run: python -m py_compile app.py
      - name: Validate Render blueprint exists
        run: test -s ../render.yaml
